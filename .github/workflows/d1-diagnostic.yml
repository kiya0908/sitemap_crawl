name: D1 Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  d1-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile

      - name: Check local D1
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply sitemap-crawl --local
          pnpm exec wrangler d1 migrations list sitemap-crawl --local
          pnpm exec wrangler d1 execute sitemap-crawl --local --command "PRAGMA table_info(page_seo_data);"
          pnpm exec wrangler d1 execute sitemap-crawl --local --command "SELECT COUNT(*) AS row_count, MAX(length(content_excerpt)) AS max_excerpt_length, SUM(CASE WHEN length(content_excerpt) > 8000 THEN 1 ELSE 0 END) AS over_8000, SUM(CASE WHEN content_hash IS NOT NULL AND content_hash <> '' THEN 1 ELSE 0 END) AS nonempty_hashes FROM page_seo_data;"

      - name: Check remote D1 read-only
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "REMOTE_CHECK=SKIPPED_MISSING_CLOUDFLARE_CREDENTIALS"
            exit 0
          fi
          echo "REMOTE_CHECK=STARTED"
          pnpm exec wrangler d1 migrations list sitemap-crawl --remote
          pnpm exec wrangler d1 execute sitemap-crawl --remote --command "PRAGMA table_info(page_seo_data);"
          pnpm exec wrangler d1 execute sitemap-crawl --remote --command "SELECT COUNT(*) AS row_count, MAX(length(content_excerpt)) AS max_excerpt_length, SUM(CASE WHEN length(content_excerpt) > 8000 THEN 1 ELSE 0 END) AS over_8000, SUM(CASE WHEN content_hash IS NOT NULL AND content_hash <> '' THEN 1 ELSE 0 END) AS nonempty_hashes FROM page_seo_data;"
          echo "REMOTE_CHECK=COMPLETED"
